<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF結合ツール - クライアントサイド処理（CSPなしテスト版）</title>

  <!-- CSPをコメントアウト -->
  <!--
  <meta http-equiv="Content-Security-Policy" content="...">
  -->

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <!-- Header -->
  <nav class="blue darken-2">
    <div class="nav-wrapper container">
      <a href="#" class="brand-logo">PDF結合ツール（CSPなしテスト版）</a>
      <ul class="right hide-on-med-and-down">
        <li><a href="#"><i class="material-icons left">security</i>端末内処理・外部送信なし</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container" style="margin-top: 20px;">

    <!-- Information Card -->
    <div class="card blue lighten-5">
      <div class="card-content">
        <span class="card-title">
          <i class="material-icons left">info</i>
          このツールについて（テスト版）
        </span>
        <p>
          <strong>これはCSPなしのテスト版です。</strong>デバッグ用に使用してください。<br>
          複数のPDFファイルやZIPファイルをブラウザ内で結合できます。
          <strong>全ての処理はお使いの端末内で完結</strong>し、データは外部に送信されません。
        </p>
      </div>
    </div>

    <!-- File Upload Section -->
    <div class="card">
      <div class="card-content">
        <span class="card-title">
          <i class="material-icons left">cloud_upload</i>
          ファイルを選択
        </span>
        <div class="file-field input-field">
          <div class="btn blue">
            <span><i class="material-icons left">folder_open</i>ファイル選択</span>
            <input type="file" id="fileInput" multiple accept=".pdf,.zip">
          </div>
          <div class="file-path-wrapper">
            <input class="file-path validate" type="text" placeholder="PDF または ZIP ファイルを選択してください（複数可）">
          </div>
        </div>
        <div class="row">
          <div class="col s12 m6">
            <button id="clearBtn" class="btn waves-effect waves-light red" disabled>
              <i class="material-icons left">clear</i>クリア
            </button>
          </div>
          <div class="col s12 m6">
            <button id="mergeBtn" class="btn waves-effect waves-light green right" disabled>
              <i class="material-icons left">merge_type</i>結合してZip保存
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="row">
      <!-- PDF List (Left Column) -->
      <div class="col s12 m4">
        <div class="card">
          <div class="card-content">
            <span class="card-title">
              <i class="material-icons left">list</i>
              PDF一覧
              <span id="pdfCount" class="badge blue white-text">0</span>
            </span>
            <div id="pdfList" class="collection">
              <div class="center-align grey-text" style="padding: 20px;">
                ファイルが選択されていません
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Page Preview (Right Column) -->
      <div class="col s12 m8">
        <div class="card">
          <div class="card-content">
            <span class="card-title">
              <i class="material-icons left">image</i>
              ページプレビュー
              <span id="pageStats" class="badge green white-text" style="display: none;">0/0 ページ</span>
            </span>

            <!-- Page Controls -->
            <div id="pageControls" style="display: none; margin-bottom: 15px;">
              <div class="chip">
                <strong id="selectedPdfName">選択なし</strong>
              </div>
              <div class="right">
                <button id="selectAllBtn" class="btn-small waves-effect waves-light blue">
                  <i class="material-icons left tiny">check_box</i>全選択
                </button>
                <button id="deselectAllBtn" class="btn-small waves-effect waves-light orange">
                  <i class="material-icons left tiny">check_box_outline_blank</i>全解除
                </button>
                <button id="invertSelectionBtn" class="btn-small waves-effect waves-light purple">
                  <i class="material-icons left tiny">swap_vert</i>反転
                </button>
              </div>
            </div>

            <!-- Page Thumbnails Grid -->
            <div id="pagePreview" class="page-grid">
              <div class="center-align grey-text" style="padding: 40px;">
                PDFを選択するとページが表示されます
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Progress Modal -->
  <div id="progressModal" class="modal">
    <div class="modal-content center-align">
      <h5 id="progressTitle">処理中...</h5>
      <div class="progress">
        <div id="progressBar" class="indeterminate"></div>
      </div>
      <p id="progressText">お待ちください</p>
    </div>
  </div>

  <!-- Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- PDF-lib -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // PDF.js worker configuration
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ライブラリ読み込み確認（デバッグ用）
    console.log('=== ライブラリ読み込み確認 ===');
    console.log('pdfjsLib:', typeof pdfjsLib !== 'undefined' ? 'OK' : 'NG');
    console.log('PDFLib:', typeof PDFLib !== 'undefined' ? 'OK' : 'NG');
    console.log('JSZip:', typeof JSZip !== 'undefined' ? 'OK' : 'NG');

    if (typeof PDFLib !== 'undefined') {
      console.log('PDFLib.PDFDocument:', PDFLib.PDFDocument);
    } else {
      console.error('❌ PDFLib が読み込まれていません！');
    }
  </script>

  <!-- Application Scripts -->
  <script src="./js/pdf-handler.js"></script>
  <script src="./js/zip-handler.js"></script>
  <script src="./js/ui-manager.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
